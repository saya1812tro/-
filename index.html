<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資格証管理システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f2ee;
  --surface: #ffffff;
  --surface2: #faf9f6;
  --border: #e2ddd6;
  --border2: #ccc8c0;
  --text: #1a1916;
  --text2: #6b6860;
  --text3: #a09d98;
  --accent: #2a5c3f;
  --accent-light: #e8f2ec;
  --accent-mid: #4a8c65;
  --danger: #c0392b;
  --danger-light: #fdf0ee;
  --warn: #b8620a;
  --warn-light: #fef6ee;
  --info: #1a4a8a;
  --info-light: #eef4fd;
  --mono: 'DM Mono', monospace;
  --sans: 'Noto Sans JP', sans-serif;
  --radius: 8px;
  --radius-lg: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* Layout */
.app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: 220px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
}

.sidebar-logo {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-logo-mark {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 16px; font-weight: 700;
  margin-bottom: 8px;
}
.sidebar-logo-name { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.3; }
.sidebar-logo-sub { font-size: 11px; color: var(--text3); }

.sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
.nav-section { margin-bottom: 20px; }
.nav-section-label { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; padding: 0 8px; margin-bottom: 6px; }
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; border-radius: var(--radius);
  cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2);
  transition: all .15s; margin-bottom: 2px; position: relative;
}
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { background: var(--accent-light); color: var(--accent); }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.nav-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; padding: 1px 6px;
  border-radius: 10px; min-width: 18px; text-align: center;
}
.nav-badge.warn { background: var(--warn); }

.sidebar-footer {
  padding: 14px 18px;
  border-top: 1px solid var(--border);
  font-size: 12px; color: var(--text3);
}
.user-info { display: flex; align-items: center; gap: 8px; }
.user-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.user-name { font-size: 12px; font-weight: 500; color: var(--text); }
.user-role { font-size: 10px; color: var(--text3); }

/* Main */
.main { margin-left: 220px; flex: 1; min-height: 100vh; }

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.topbar-title { font-size: 16px; font-weight: 700; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }

.search-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 6px 12px;
  font-size: 13px; color: var(--text2);
  cursor: text; min-width: 220px;
}
.search-box input {
  border: none; background: none; outline: none;
  font-family: var(--sans); font-size: 13px; color: var(--text); width: 100%;
}

.content { padding: 24px 28px; }

/* Cards & Panels */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-title { font-size: 14px; font-weight: 700; }
.card-body { padding: 20px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: var(--radius);
  border: 1px solid var(--border2); background: var(--surface);
  font-family: var(--sans); font-size: 13px; font-weight: 500;
  color: var(--text); cursor: pointer; transition: all .12s;
  white-space: nowrap;
}
.btn:hover { background: var(--bg); border-color: var(--border2); }
.btn svg { width: 14px; height: 14px; }
.btn-primary {
  background: var(--accent); color: #fff;
  border-color: var(--accent);
}
.btn-primary:hover { background: #1f4a30; }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-danger:hover { background: #a32722; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-ghost { border-color: transparent; background: none; }
.btn-ghost:hover { background: var(--bg); }

/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 700;
}
.badge-green { background: var(--accent-light); color: var(--accent); }
.badge-red { background: var(--danger-light); color: var(--danger); }
.badge-warn { background: var(--warn-light); color: var(--warn); }
.badge-blue { background: var(--info-light); color: var(--info); }
.badge-gray { background: var(--bg); color: var(--text2); border: 1px solid var(--border); }

/* Category badges */
.cat-国家資格 { background: #f0e8ff; color: #5b21b6; }
.cat-技能講習 { background: #fff3cd; color: #856404; }
.cat-特別教育 { background: #dbeafe; color: #1e40af; }
.cat-安全衛生教育 { background: #d1fae5; color: #065f46; }

/* Grid */
.grid { display: grid; gap: 16px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: 1fr 1fr; }

/* Metric cards */
.metric-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
}
.metric-label { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
.metric-value { font-size: 28px; font-weight: 700; line-height: 1; }
.metric-sub { font-size: 12px; color: var(--text3); margin-top: 4px; }
.metric-card.danger { border-color: #f5c6c4; background: #fff8f8; }
.metric-card.danger .metric-value { color: var(--danger); }
.metric-card.warn { border-color: #f5ddb0; background: #fffbf4; }
.metric-card.warn .metric-value { color: var(--warn); }
.metric-card.accent { border-color: #b8d9c5; background: #f4fbf7; }
.metric-card.accent .metric-value { color: var(--accent); }

/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th {
  padding: 10px 14px; text-align: left;
  font-size: 11px; font-weight: 700; color: var(--text2);
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  text-transform: uppercase; letter-spacing: .05em;
}
tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
tbody tr:hover { background: var(--surface2); cursor: pointer; }
tbody tr:last-child { border-bottom: none; }
tbody td { padding: 12px 14px; font-size: 13px; vertical-align: middle; }

/* Alert bar */
.alert-bar {
  padding: 10px 16px; border-radius: var(--radius);
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; margin-bottom: 8px;
}
.alert-bar.danger { background: var(--danger-light); border: 1px solid #f5c6c4; color: var(--danger); }
.alert-bar.warn { background: var(--warn-light); border: 1px solid #f5ddb0; color: var(--warn); }
.alert-bar svg { width: 16px; height: 16px; flex-shrink: 0; }

/* Tabs */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab-item {
  padding: 10px 18px; font-size: 13px; font-weight: 500;
  color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent;
  transition: all .15s; margin-bottom: -1px;
}
.tab-item:hover { color: var(--text); }
.tab-item.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Modal overlay */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 200;
  align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  width: 560px; max-width: 95vw;
  max-height: 90vh; overflow-y: auto;
  border: 1px solid var(--border);
}
.modal-header {
  padding: 18px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-size: 15px; font-weight: 700; }
.modal-body { padding: 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex; gap: 10px; justify-content: flex-end;
}

/* Form */
.form-group { margin-bottom: 16px; }
.form-label { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 6px; display: block; }
.form-control {
  width: 100%; padding: 8px 12px;
  border: 1px solid var(--border2); border-radius: var(--radius);
  font-family: var(--sans); font-size: 13px; color: var(--text);
  background: var(--surface); outline: none;
  transition: border-color .15s;
}
.form-control:focus { border-color: var(--accent); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
select.form-control { cursor: pointer; }

/* Image upload area */
.upload-zone {
  border: 2px dashed var(--border2);
  border-radius: var(--radius-lg);
  padding: 28px 20px;
  text-align: center;
  cursor: pointer;
  transition: all .15s;
  background: var(--surface2);
}
.upload-zone:hover { border-color: var(--accent); background: var(--accent-light); }
.upload-zone.drag-over { border-color: var(--accent); background: var(--accent-light); border-style: solid; transform: scale(1.01); transition: all .1s; }
.upload-icon { font-size: 32px; margin-bottom: 8px; }
.upload-text { font-size: 13px; color: var(--text2); }
.upload-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* Image viewer */
.img-viewer {
  background: #1a1916;
  border-radius: var(--radius-lg);
  aspect-ratio: 4/3;
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.img-viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
.img-placeholder {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  color: #6b6860;
}
.img-placeholder svg { width: 48px; height: 48px; opacity: .4; }

/* Image thumbs */
.thumb-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.thumb {
  width: 80px; height: 60px;
  border-radius: 6px; border: 2px solid transparent;
  background: var(--bg); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden; transition: border-color .12s;
}
.thumb.active { border-color: var(--accent); }
.thumb svg { width: 24px; height: 24px; color: var(--text3); }

/* Status dot */
.status-dot {
  display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; margin-right: 5px;
}
.dot-green { background: var(--accent-mid); }
.dot-red { background: var(--danger); }
.dot-warn { background: var(--warn); }
.dot-gray { background: var(--text3); }

/* Expiry bar */
.expiry-bar {
  height: 4px; border-radius: 2px;
  background: var(--border); overflow: hidden;
  margin-top: 4px;
}
.expiry-fill { height: 100%; border-radius: 2px; transition: width .3s; }

/* Section */
.section { margin-bottom: 24px; }
.section-title {
  font-size: 12px; font-weight: 700; color: var(--text2);
  text-transform: uppercase; letter-spacing: .07em;
  margin-bottom: 12px;
}

/* Divider */
.divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

/* Empty state */
.empty-state {
  text-align: center; padding: 48px 20px; color: var(--text3);
}
.empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: .4; }
.empty-state p { font-size: 14px; }

/* Toast */
.toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--text); color: #fff;
  padding: 10px 16px; border-radius: var(--radius);
  font-size: 13px; font-weight: 500;
  animation: slideIn .2s ease; min-width: 200px;
}
.toast.success { background: var(--accent); }
.toast.error { background: var(--danger); }
@keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Detail view */
.detail-header {
  display: flex; align-items: flex-start; gap: 20px;
  padding: 24px; border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.detail-avatar {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; flex-shrink: 0;
}
.detail-info { flex: 1; }
.detail-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.detail-meta { font-size: 13px; color: var(--text2); display: flex; gap: 16px; flex-wrap: wrap; }
.detail-meta span { display: flex; align-items: center; gap: 5px; }
.detail-meta svg { width: 13px; height: 13px; }

/* Responsive helper */
.hidden { display: none !important; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-mark">資</div>
    <div class="sidebar-logo-name">資格証管理システム</div>
    <div class="sidebar-logo-sub">建設業・電気工事業向け</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">
      <div class="nav-section-label">メイン</div>
      <div class="nav-item active" onclick="showPage('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        ダッシュボード
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">管理</div>
      <div class="nav-item" onclick="showPage('employees')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        従業員管理
      </div>
      <div class="nav-item" onclick="showPage('qualifications')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
        資格一覧
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">アラート</div>
      <div class="nav-item" id="nav-expired" onclick="showPage('expired')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        期限切れ
        <span class="nav-badge" id="badge-expired">3</span>
      </div>
      <div class="nav-item" id="nav-expiring" onclick="showPage('expiring')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        更新予定
        <span class="nav-badge warn" id="badge-expiring">8</span>
      </div>
    </div>
  </nav>
  <div class="sidebar-footer" onclick="showAdminModal()" style="cursor:pointer" title="管理者情報を編集">
    <div class="user-info">
      <div class="user-avatar" id="admin-avatar">管</div>
      <div style="flex:1;min-width:0">
        <div class="user-name" id="admin-name">管理者名未設定</div>
        <div class="user-role" id="admin-role">管理者</div>
      </div>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;color:var(--text3)"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </div>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="page-title">ダッシュボード</div>
    <div class="topbar-actions">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="global-search" placeholder="従業員・資格を検索..." oninput="handleSearch(this.value)">
      </div>
      <button class="btn" onclick="showAddEmpModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        従業員を登録
      </button>
      <button class="btn btn-primary" onclick="showAddModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        資格を追加
      </button>
    </div>
  </div>

  <div class="content" id="content">
    <!-- injected by JS -->
  </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">資格を追加</div>
      <button class="btn btn-ghost btn-sm" onclick="closeModal('add-modal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div id="f-employee-row" class="form-row">
        <div class="form-group">
          <label class="form-label">従業員</label>
          <select class="form-control" id="f-employee">
            <option value="">選択してください</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">資格名</label>
          <select class="form-control" id="f-qualification">
            <option value="">選択してください</option>
          </select>
        </div>
      </div>
      <div id="f-employee-fixed" style="display:none;margin-bottom:14px;">
        <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;">従業員</div>
        <div id="f-employee-name" style="padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--text2);"></div>
      </div>
      <div id="f-qual-solo" style="display:none;margin-bottom:14px;">
        <div class="form-group">
          <label class="form-label">資格名</label>
          <select class="form-control" id="f-qualification-solo">
            <option value="">選択してください</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">取得日</label>
          <input type="date" class="form-control" id="f-acquired">

function getEmployee(id) { return employees.find(e => e.id === id); }

function daysDiff(expiry) {
  if (!expiry) return null;
  const exp = new Date(expiry);
  return Math.floor((exp - today) / 86400000);
}
function getStatus(rec) {
  const d = daysDiff(rec.expiry);
  if (!rec.expiry) return 'noexpiry';
  if (d < 0) return 'expired';
  if (d <= 90) return 'expiring';
  return 'valid';
}

  if (s === 'noexpiry') return '<span class="badge badge-gray">期限なし</span>';
  if (s === 'expired') return '<span class="badge badge-red">期限切れ</span>';
  if (s === 'expiring') return `<span class="badge badge-warn">残${d}日</span>`;
  return '<span class="badge badge-green">有効</span>';
}
function catBadge(cat) {
  return `<span class="badge cat-${cat}">${cat}</span>`;
}
function fmtDate(d) {
  if (!d) return '—';
  return d.replace(/-/g, '/');
}
function expiryFill(rec) {
  const d = daysDiff(rec.expiry);
  if (!rec.expiry || d < 0) return 0;
  const pct = Math.min(100, Math.round(d / 365 * 100));
  const color = d <= 90 ? 'var(--warn)' : 'var(--accent-mid)';
  return `<div class="expiry-bar"><div class="expiry-fill" style="width:${pct}%;background:${color}"></div></div>`;
}

// Derived counts
function expiredRecords() { return records.filter(r => getStatus(r) === 'expired'); }
function expiringRecords() { return records.filter(r => getStatus(r) === 'expiring'); }

// 資格別CSV出力
function exportCSVForQual(qualId) {
  const q = getQual(qualId);
  const holders = records.filter(r => r.qualId === qualId);
  const header = ['資格名', '区分', '従業員名', '所属', '取得日', '有効期限', '状態'];
  const rows = holders.map(r => {
    const e = getEmployee(r.empId);
    const s = getStatus(r);
    const statusLabel = s==='expired'?'期限切れ':s==='expiring'?'要更新':s==='noexpiry'?'期限なし':'有効';
    return [q.name, q.category, e?.name, e?.dept, r.acquired, r.expiry||'', statusLabel];
  });
  const csv = [header, ...rows].map(row => row.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${q.name}_所持者一覧_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('CSVをダウンロードしました', 'success');
}

// ============================================================
// EXPIRED / EXPIRING PAGES
// ============================================================
function renderAlertTable(list) {
  if (list.length === 0) return '<div class="empty-state"><p>該当する資格はありません</p></div>';
  const rows = list.map(r => {
    const e = getEmployee(r.empId), q = getQual(r.qualId);
    const hasImg = r.images && r.images.length > 0;
    return `<tr onclick="showEmpDetail(${r.empId})">
      <td>${statusBadge(r)}</td>
      <td><strong>${e?.name}</strong><div style="font-size:11px;color:var(--text3)">${e?.dept}</div></td>
      <td>${catBadge(q?.category)}</td>
      <td>${q?.name}</td>
      <td style="font-family:var(--mono);font-size:12px;color:${getStatus(r)==='expired'?'var(--danger)':'var(--warn)'}">${fmtDate(r.expiry)}</td>
      <td onclick="event.stopPropagation()">
        ${hasImg
          ? `<button class="btn btn-sm" onclick="openImgViewer(${r.id})"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> 資格証確認</button>`
          : `<span style="font-size:12px;color:var(--text3)">画像未登録</span>`}
      </td>
    </tr>`;
  }).join('');
  return `<div class="card"><div class="table-wrap"><table>
    <thead><tr><th>状態</th><th>従業員</th><th>区分</th><th>資格名</th><th>期限日</th><th>資格証</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div></div>`;
}

function renderExpiredPage() {
  const list = expiredRecords();
  return `<div class="alert-bar danger" style="margin-bottom:16px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><strong>${list.length}件の資格が期限切れです。早急に更新手続きを行ってください。</strong></div>` + renderAlertTable(list);
}

function renderExpiringPage() {
  const list = expiringRecords();
  return `<div class="alert-bar warn" style="margin-bottom:16px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><strong>${list.length}件の資格が3か月以内に期限を迎えます。更新の準備を始めてください。</strong></div>` + renderAlertTable(list);
}

// ============================================================
// SEARCH
// ============================================================
let searchQuery = '';
function handleSearch(val) {
  searchQuery = val;
  if (val.length >= 1) {
    currentPage = 'search';
    document.getElementById('page-title').textContent = `"${val}" の検索結果`;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    renderPage('search');
  } else {
    showPage('dashboard');
  }
}

function renderSearch() {
  const q = searchQuery;
  const matchedEmps = employees.filter(e => e.name.includes(q) || e.dept.includes(q));
  const matchedRecs = records.filter(r => {
    const e = getEmployee(r.empId), qual = getQual(r.qualId);
    return e?.name.includes(q) || e?.dept.includes(q) || qual?.name.includes(q);
  });

  let html = `<div style="margin-bottom:16px;color:var(--text2);font-size:13px">「${q}」の検索結果 — 従業員 ${matchedEmps.length}名 / 資格 ${matchedRecs.length}件</div>`;

  if (matchedEmps.length) {
    const rows = matchedEmps.map(e => `<tr onclick="showEmpDetail(${e.id})">
      <td><div style="font-weight:600">${e.name}</div><div style="font-size:11px;color:var(--text3)">${e.dept}</div></td>
      <td>${records.filter(r=>r.empId===e.id).length}件</td>
    </tr>`).join('');
    html += `<div style="margin-bottom:16px"><div class="section-title">従業員</div><div class="card"><div class="table-wrap"><table><thead><tr><th>従業員</th><th>保有資格数</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`;
  }
  if (matchedRecs.length) {
    html += `<div class="section-title">資格</div>` + renderAlertTable(matchedRecs);
  }
  if (!matchedEmps.length && !matchedRecs.length) {
    html += `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>該当するデータが見つかりません</p></div>`;
  }
  return html;
}

function showAddModal(presetEmpId = null) {
  const empRow   = document.getElementById('f-employee-row');
  const empFixed = document.getElementById('f-employee-fixed');
  const empName  = document.getElementById('f-employee-name');
  const qualSolo = document.getElementById('f-qual-solo');

  if (presetEmpId) {
    // 従業員詳細から呼ばれた場合：従業員選択欄を非表示にして固定表示
    const e = getEmployee(presetEmpId);
    empRow.style.display   = 'none';
    empFixed.style.display = 'block';
    qualSolo.style.display = 'block';
    empName.textContent    = e ? `${e.name}　（${e.dept}）` : '';

    // f-employeeに値をセット（saveRecord側で使う）
    const empSel = document.getElementById('f-employee');
    empSel.innerHTML = `<option value="${presetEmpId}" selected></option>`;

    // 資格名はsolo用セレクトに表示
    const qSoloSel = document.getElementById('f-qualification-solo');
    qSoloSel.innerHTML = '<option value="">選択してください</option>' +
      qualMasters.map(q => `<option value="${q.id}">[${q.category}] ${q.name}</option>`).join('');
    // f-qualificationもsolo連動させる
    qSoloSel.onchange = () => {
      document.getElementById('f-qualification').innerHTML =
        `<option value="${qSoloSel.value}" selected></option>`;
    };

    document.getElementById('modal-title').textContent = e ? `${e.name} に資格を追加` : '資格を追加';
  } else {
    // 通常の「+資格を追加」ボタンから呼ばれた場合
    empRow.style.display   = '';
    empFixed.style.display = 'none';
    qualSolo.style.display = 'none';

    const empSel = document.getElementById('f-employee');
    const qualSel = document.getElementById('f-qualification');
    empSel.innerHTML  = '<option value="">選択してください</option>' +
      employees.map(e => `<option value="${e.id}">${e.name} (${e.dept})</option>`).join('');
    qualSel.innerHTML = '<option value="">選択してください</option>' +
      qualMasters.map(q => `<option value="${q.id}">[${q.category}] ${q.name}</option>`).join('');
    document.getElementById('modal-title').textContent = '資格を追加';
  }

  document.getElementById('upload-thumbs').innerHTML = '';
  document.getElementById('f-acquired').value = '';
  document.getElementById('f-expiry').value   = '';
  document.getElementById('f-notes').value    = '';
  document.getElementById('add-modal').classList.add('open');
}

let uploadedFiles = [];

function handleFileUpload(input) {
  const files = Array.from(input.files);
  uploadedFiles = files.slice(0, 5);
  const thumbs = document.getElementById('upload-thumbs');
  thumbs.innerHTML = '';
  uploadedFiles.forEach((f, i) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const div = document.createElement('div');
      div.className = 'thumb' + (i===0?' active':'');
      if (f.type.startsWith('image/')) {
        div.style.backgroundImage = `url(${ev.target.result})`;
        div.style.backgroundSize = 'cover';
        div.style.backgroundPosition = 'center';
      } else {
        div.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
      }
      thumbs.appendChild(div);
    };
    reader.readAsDataURL(f);
  });
}

async function saveRecord() {
  const empId = parseInt(document.getElementById('f-employee').value);
  // solo表示中はf-qualification-soloの値を優先
  const qualSolo = document.getElementById('f-qualification-solo');
  const qualVal  = (qualSolo && qualSolo.style.display !== 'none' && qualSolo.value)
                    ? qualSolo.value
                    : document.getElementById('f-qualification').value;
  const qualId   = parseInt(qualVal);
  const acquired = document.getElementById('f-acquired').value;
  const expiry   = document.getElementById('f-expiry').value;
  if (!empId || !qualId) { showToast('従業員と資格を選択してください', 'error'); return; }
  if (!acquired) { showToast('取得日を入力してください', 'error'); return; }

  // 画像はセッション内一時保管（後でSupabase Storage連携に拡張可）
  const imgKeys = uploadedFiles.length > 0
    ? uploadedFiles.map((f, i) => `upload_tmp_${Date.now()}_${i}.${f.name.split('.').pop()}`)
    : [];
  uploadedFiles.forEach((f, i) => {
    const reader = new FileReader();
    reader.onload = ev => { dummyImages[imgKeys[i]] = ev.target.result; };
    reader.readAsDataURL(f);
  });

  const newRec = { empId, qualId, acquired, expiry: expiry || null, images: imgKeys, notes: document.getElementById('f-notes').value };
  setLoading(true, '資格を保存中...');
  const newId = await dbInsertRecord(newRec);
  setLoading(false);
  if (!newId) return;

  newRec.id = newId;
  records.push(newRec);
  uploadedFiles = [];
  updateBadges();
  closeModal('add-modal');
  showToast('資格を登録しました', 'success');
  renderPage(currentPage);
}

let editingEmpId = null;

function showAddEmpModal(empId = null) {
  editingEmpId = empId;
  const isEdit = empId !== null;
  document.getElementById('emp-modal-title').textContent = isEdit ? '従業員情報を編集' : '従業員を登録';
  if (isEdit) {
    const e = getEmployee(empId);
    document.getElementById('ef-name').value  = e.name;
    document.getElementById('ef-dept').value  = e.dept;
    document.getElementById('ef-hire').value  = e.hire;
    document.getElementById('ef-status').value = e.status;
    document.getElementById('ef-email').value = e.email || '';
    document.getElementById('ef-notes').value = e.notes || '';
  } else {
    document.getElementById('ef-name').value  = '';
    document.getElementById('ef-dept').value  = '';
    document.getElementById('ef-hire').value  = '';
    document.getElementById('ef-status').value = '在籍';
    document.getElementById('ef-email').value = '';
    document.getElementById('ef-notes').value = '';
  }
  closeModal('emp-modal');
  document.getElementById('emp-add-modal').classList.add('open');
}

async function saveEmployee() {
  const name   = document.getElementById('ef-name').value.trim();
  const dept   = document.getElementById('ef-dept').value.trim();
  const hire   = document.getElementById('ef-hire').value;
  const status = document.getElementById('ef-status').value;
  if (!name) { showToast('氏名を入力してください', 'error'); return; }
  if (!dept) { showToast('所属部署を入力してください', 'error'); return; }
  if (!hire) { showToast('入社日を入力してください', 'error'); return; }

  const parts    = name.replace(/\s+/g, ' ').trim().split(' ');
  const initials = parts.length >= 2 ? parts[0][0] + parts[1][0] : parts[0].slice(0, 2);
  const email    = document.getElementById('ef-email').value.trim();
  const notes    = document.getElementById('ef-notes').value.trim();

  setLoading(true, '従業員情報を保存中...');

  if (editingEmpId !== null) {
    const e = getEmployee(editingEmpId);
    Object.assign(e, { name, dept, hire, status, initials, email, notes });
    const ok = await dbUpdateEmployee(e);
    setLoading(false);
    if (!ok) return;
    showToast('従業員情報を更新しました', 'success');
  } else {
    const newEmp = { name, dept, hire, status, initials, email, notes };
    const newId  = await dbInsertEmployee(newEmp);
    setLoading(false);
    if (!newId) return;
    newEmp.id = newId;
    employees.push(newEmp);
    showToast(name + ' を登録しました', 'success');
  }
  closeModal('emp-add-modal');
  renderPage(currentPage);
}

// ============================================================
// IMAGE VIEWER
// ============================================================
function openImgViewer(recId) {
  const r = records.find(x => x.id === recId);
  if (!r) return;
  currentImgRecord = r;
  currentImgIndex = 0;
  const e = getEmployee(r.empId), q = getQual(r.qualId);
  document.getElementById('img-modal-title').textContent = q?.name;
  document.getElementById('img-modal-sub').textContent = e?.name + '　|　' + fmtDate(r.expiry) + (r.expiry ? '　まで' : '');
  renderViewer();
  document.getElementById('img-modal').classList.add('open');
}

function renderViewer() {
  const r = currentImgRecord;
  const viewer = document.getElementById('img-viewer');
  const thumbsEl = document.getElementById('viewer-thumbs');
  const imgs = r.images;

  if (!imgs || imgs.length === 0) {
    viewer.innerHTML = `<div class="img-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><div>画像未登録</div></div>`;
    thumbsEl.innerHTML = '';
    return;
  }

  const src = dummyImages[imgs[currentImgIndex]];
  if (src) {
    viewer.innerHTML = `<img src="${src}" alt="資格証">`;
  } else {
    viewer.innerHTML = `<div class="img-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><div>読み込み中...</div></div>`;
  }

  thumbsEl.innerHTML = imgs.map((k, i) => {
    const tsrc = dummyImages[k];
    const isPDF = k.endsWith('.pdf');
    return `<div class="thumb ${i===currentImgIndex?'active':''}" onclick="setViewerImg(${i})" style="${tsrc&&!isPDF?`background-image:url(${tsrc});background-size:cover;background-position:center`:''}">
      ${isPDF||!tsrc?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`:''}
    </div>`;
  }).join('');
}

function setViewerImg(idx) {
  currentImgIndex = idx;
  renderViewer();
}

function downloadImg() {
  const r = currentImgRecord;
  if (!r || !r.images || r.images.length === 0) { showToast('画像がありません', 'error'); return; }
  const key = r.images[currentImgIndex];
  const src = dummyImages[key];
  if (!src) { showToast('画像データがありません', 'error'); return; }
  const a = document.createElement('a');
  a.href = src;
  a.download = key;
  a.click();
  showToast('ダウンロード開始しました');
}

function openNewTab() {
  const r = currentImgRecord;
  if (!r || !r.images || r.images.length === 0) return;
  const src = dummyImages[r.images[currentImgIndex]];
  if (src) {
    const w = window.open();
    w.document.write(`<img src="${src}" style="max-width:100%;height:auto">`);
  }
}

// ============================================================
// CSV EXPORT
// ============================================================
function exportCSV() {
  const header = ['従業員名', '所属', '資格区分', '資格名', '取得日', '有効期限', '状態'];
  const rows = records.map(r => {
    const e = getEmployee(r.empId), q = getQual(r.qualId);
    const s = getStatus(r);
    const statusLabel = s==='expired'?'期限切れ':s==='expiring'?'要更新':s==='noexpiry'?'期限なし':'有効';
    return [e?.name, e?.dept, q?.category, q?.name, r.acquired, r.expiry||'', statusLabel];
  });
  const csv = [header, ...rows].map(row => row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `資格管理_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('CSVをダウンロードしました', 'success');
}

// ============================================================
// UTILITIES
// ============================================================
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function showToast(msg, type='') {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function updateBadges() {
  const be = document.getElementById('badge-expired');
  const bw = document.getElementById('badge-expiring');
  if (be) be.textContent = expiredRecords().length;
  if (bw) bw.textContent = expiringRecords().length;
}
